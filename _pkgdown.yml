- title: The normalisation surface
  desc: Drop-in replacements for the pipelines this was extracted from.
  contents:
  - normalize_string
  - normalize_name_columns
  - normalize_physician_names
  - sql_npi_name
  - sql_name_clean
  - sql_name_compact
  - sql_middle_initial_guard
