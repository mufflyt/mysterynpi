  - surname_token_table
  - extract_suffix
  - SURNAME_PARTICLES
  - MIN_SURNAME_TOKEN
- title: Agreement rules
  desc: Three verdicts; "uninformative" is load-bearing and is not agreement.
  contents:
  - middle_agreement
  - person_matches
  - gender_agreement
  - normalize_gender
  - nickname_agreement
  - given_name_agreement
  - assert_given_name_agreement_contract
  - nickname_dictionary_version
  - NICKNAME_EDGES
  - suffix_agreement
  - normalize_suffix
  - license_agreement
  - normalize_license
  - license_anatomy
  - license_conformance
  - normalize_license_status
  - LICENSE_STATUS_LEVELS
  - license_status_audit
  - surname_agreement
  - surname_rarity
  - graduation_year_agreement
  - graduation_year_band
  - GRADUATION_YEAR_BANDS
  - taxonomy_consistent
  - taxonomy_tiebreak_rank
  - taxonomy_family_pattern
  - TAXONOMY_FAMILY_PATTERNS
- title: Nickname dictionary (deterministic table reads)
  desc: The fenced exception; extracted from isochrones, quirks pinned.
  contents:
  - create_nickname_dictionary
  - get_nickname_dictionary
  - get_canonical_name
  - are_nickname_equivalents
  - get_nicknames_for_name
- title: Clerical review
  desc: A blinded, class-stratified sample, and the precision it buys.
  contents:
  - clerical_sample
  - clerical_precision
- title: Ordered classes and the one-to-one constraint
  contents:
  - collapse_candidates
  - pool_stats
  - resolve_best_class
  - resolve_ordered_classes
  - resolve_one_to_one
  - count_rivals
  - award_contested
  - duplicate_differences
  - ledgered_join
  - join_ledger_entry
- title: Evaluation corpora
  desc: Vendored and authored data; licenses in inst/COPYRIGHTS.
  contents:
  - ROSTER_BENCHMARK
  - WINKLER_CENSUS
  - SURNAME_FREQUENCIES
- title: End-to-end NPPES matching
  desc: A roster to NPIs in one call, from a data frame or a read-only DuckDB table.
  contents:
  - match_npi
  - MATCH_NPI_ATTRIBUTES
- title: NPI
  contents:
  - npi_luhn_ok
  - npi_corroborate
  - ORG_NOISE
  - org_name_matches_person
  - strip_med_suffix
  - MEDICAL_UNIT_PATTERNS
  - normalize_credential
  - npi_search
  - parse_npi_search
  - parse_npi_licenses
  - nickname_variants
  - NICKNAME_POLICY
  - assert_nickname_policy
  - SOURCE_CLASSES
- title: Contracts
  desc: Assertions a caller runs in its own suite.
  contents:
  - assert_middle_agreement_contract
  - assert_gender_agreement_contract
  - assert_nickname_agreement_contract
  - assert_suffix_agreement_contract
  - assert_license_agreement_contract
  - assert_surname_agreement_contract
  - assert_license_status_contract
  - assert_org_name_matches_person_contract

- title: Missing and undefined values
  desc: >
    The policy every agreement rule applies, selectable since 0.10.0 with the
    previous behaviour as its default. Imputation is deliberately absent: an
    imputed name is a fabricated identity claim.
  contents:
  - NA_ACTIONS
  - resolve_na_action
  - count_missing_values
  - is_undefined_number
  - finite_or_na

- title: Input structures
  desc: >
    The shapes a caller may pass, and the diagnostics emitted when a
    conversion loses something. One place decides input shape, so the entry
    points stop each making their own partial version of it.
  contents:
  - as_linkage_table
  - read_name_column
  - reject_list_columns
  - drop_vector_attributes
  - check_scalar
  - affirm_unique_index

- title: The match result
  desc: >
    match_npi() returns an object with methods rather than a bare list. The
    class is additive: the same five elements under the same names, so every
    existing caller keeps working.
  contents:
  - new_npi_match_result
  - print.npi_match_result
  - format.npi_match_result
  - summary.npi_match_result
  - print.summary.npi_match_result
  - nobs.npi_match_result

- title: Benchmark and comparison
  desc: >
    The reference evaluation that vignette("roster-benchmark") narrates, as
    callable functions, plus the head-to-head against the edit-distance
    matcher these rules reject.
  contents:
  - benchmark_axes
  - benchmark_decisions
  - benchmark_comparison

- title: internal
  contents:
  - NA_standards
  - srr-benchmark
  - srr-input-structures
  - srr-match-result-class
  - srr-missing-policy
  - srr-stats-documentation
  - srr-stats-input
